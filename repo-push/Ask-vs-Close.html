<!-- @dsCard group="Slides" viewport="1280x720" subtitle="Ask vs. Close" name="Ask vs. Close" -->
<!-- @startingPoint section="SIG Slides" subtitle="Ask vs. Close — SIG deck bank" viewport="1920x1080" -->
<!-- Ask vs. Close — matched ask-to-close pairs with a concession column. A different measurement from the unmatched averages on the comp slides; the READ must say so. -->
<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<script src="../image-slot.js"></script>
<style>html,body{margin:0;padding:0;background:#08202f;}</style>
</head>
<body>
<div style="width:1280px;height:720px;overflow:hidden;">
<div style="width:1920px;height:1080px;transform:scale(0.66667);transform-origin:top left;position:relative;">
<section data-label="Ask vs. Close" data-screen-label="11" data-speaker-notes="Matched ask-to-close pairs — a different measurement from the unmatched averages. Pairs pending." style="height:100%;box-sizing:border-box;display:flex;flex-direction:column;padding:84px 100px 64px;background:#ffffff;color:var(--navy);font-family:'Roboto',sans-serif;">
  <div style="display:flex;justify-content:space-between;align-items:flex-start;gap:40px;">
    <div style="display:flex;flex-direction:column;gap:12px;">
      <div style="font-family:'Roboto Condensed',sans-serif;font-weight:700;font-size:24px;letter-spacing:0.3em;text-transform:uppercase;color:var(--blue);">Ask vs. Close</div>
      <h2 style="margin:0;font-family:'Roboto Condensed',sans-serif;font-weight:700;font-size:56px;line-height:1.05;">What Sellers Asked, What Buyers Paid</h2>
      <p style="margin:0;font-size:27px;font-weight:300;color:var(--mut);">Concession from list to close across the closed set &mdash; matched pairs, not unmatched averages</p>
    </div>
    <image-slot id="tenant-logo" shape="rect" fit="contain" placeholder="Tenant logo — drop PNG" style="width:340px;height:88px;flex:none;display:block;"></image-slot>
  </div>
  <table style="margin-top:32px;width:100%;border-collapse:collapse;">
    <thead><tr>
      <th style="text-align:left;font-family:'Roboto Condensed',sans-serif;font-weight:700;font-size:24px;letter-spacing:0.08em;text-transform:uppercase;color:var(--mut);padding:0 10px 12px;border-bottom:2px solid var(--navy);">Comp</th>
      <th style="text-align:center;font-family:'Roboto Condensed',sans-serif;font-weight:700;font-size:24px;letter-spacing:0.08em;text-transform:uppercase;color:var(--mut);padding:0 10px 12px;border-bottom:2px solid var(--navy);">Ask</th>
      <th style="text-align:center;font-family:'Roboto Condensed',sans-serif;font-weight:700;font-size:24px;letter-spacing:0.08em;text-transform:uppercase;color:var(--mut);padding:0 10px 12px;border-bottom:2px solid var(--navy);">Ask cap</th>
      <th style="text-align:center;font-family:'Roboto Condensed',sans-serif;font-weight:700;font-size:24px;letter-spacing:0.08em;text-transform:uppercase;color:var(--mut);padding:0 10px 12px;border-bottom:2px solid var(--navy);">Close</th>
      <th style="text-align:center;font-family:'Roboto Condensed',sans-serif;font-weight:700;font-size:24px;letter-spacing:0.08em;text-transform:uppercase;color:var(--mut);padding:0 10px 12px;border-bottom:2px solid var(--navy);">Close cap</th>
      <th style="text-align:right;font-family:'Roboto Condensed',sans-serif;font-weight:700;font-size:24px;letter-spacing:0.08em;text-transform:uppercase;color:var(--mut);padding:0 10px 12px;border-bottom:2px solid var(--navy);">Concession</th>
    </tr></thead>
    <tbody>
      <sc-for list="{{ blankPairs }}" as="pair" hint-placeholder-count="5">
      <tr>
        <td style="font-size:25px;font-weight:300;padding:13px 10px;border-bottom:1px solid var(--line);color:var(--mut);">&mdash;</td>
        <td style="text-align:center;font-size:25px;font-weight:300;padding:13px 10px;border-bottom:1px solid var(--line);color:var(--mut);">&mdash;</td>
        <td style="text-align:center;font-size:25px;font-weight:300;padding:13px 10px;border-bottom:1px solid var(--line);color:var(--mut);">&mdash;</td>
        <td style="text-align:center;font-size:25px;font-weight:300;padding:13px 10px;border-bottom:1px solid var(--line);color:var(--mut);">&mdash;</td>
        <td style="text-align:center;font-size:25px;font-weight:300;padding:13px 10px;border-bottom:1px solid var(--line);color:var(--mut);">&mdash;</td>
        <td style="text-align:right;font-size:25px;font-weight:300;padding:13px 10px;border-bottom:1px solid var(--line);color:var(--mut);">&mdash;</td>
      </tr>
      </sc-for>
      <tr>
        <td style="font-family:'Roboto Condensed',sans-serif;font-weight:700;font-size:27px;padding:13px 10px;border-top:3px solid var(--navy);">Average</td>
        <td style="text-align:center;font-family:'Roboto Condensed',sans-serif;font-weight:700;font-size:27px;padding:13px 10px;border-top:3px solid var(--navy);color:var(--mut);">&mdash;</td>
        <td style="text-align:center;font-family:'Roboto Condensed',sans-serif;font-weight:700;font-size:27px;padding:13px 10px;border-top:3px solid var(--navy);color:var(--mut);">&mdash;</td>
        <td style="text-align:center;font-family:'Roboto Condensed',sans-serif;font-weight:700;font-size:27px;padding:13px 10px;border-top:3px solid var(--navy);color:var(--mut);">&mdash;</td>
        <td style="text-align:center;font-family:'Roboto Condensed',sans-serif;font-weight:700;font-size:27px;padding:13px 10px;border-top:3px solid var(--navy);color:var(--mut);">&mdash;</td>
        <td style="text-align:right;font-family:'Roboto Condensed',sans-serif;font-weight:700;font-size:27px;padding:13px 10px;border-top:3px solid var(--navy);color:var(--mut);">&mdash;</td>
      </tr>
    </tbody>
  </table>
  <div style="margin-top:auto;padding-top:24px;display:flex;justify-content:space-between;align-items:center;border-top:1px solid var(--line);"><span style="font-size:24px;color:#8a97a0;">Sands Investment Group | Confidential · <a href="https://sandsig.com" style="color:inherit;text-decoration:underline;">sandsig.com</a></span><img src="../assets/sig-icon-color.png" alt="SIG" style="height:42px;"></div>
</section>
</div>
</div>
</body>
</html>
