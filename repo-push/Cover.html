<!-- Cover — swap tenant name, address, ownership entity and date. Deal logos live in image-slot drop zones on the content slides; a tenant mark goes on the cover only when a reversed (white) lockup exists, since most brand PNGs disappear on the navy gradient. -->
<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<script src="../image-slot.js"></script>
<style>html,body{margin:0;padding:0;background:#08202f;}</style>
</head>
<body>
<div style="width:1280px;height:720px;overflow:hidden;">
<div style="width:1920px;height:1080px;transform:scale(0.66667);transform-origin:top left;position:relative;">
<section data-label="Cover" data-screen-label="01" data-speaker-notes="Name the property and the purpose in one sentence. This is a valuation and a plan, not a pitch." style="height:100%;box-sizing:border-box;display:flex;flex-direction:column;justify-content:space-between;padding:84px 100px 64px;background:linear-gradient(135deg,#0d324f 0%,#2b5c81 100%);color:#ffffff;font-family:'Roboto',sans-serif;">
  <div style="display:flex;justify-content:space-between;align-items:center;gap:40px;">
    <img src="../assets/sig-wide-white.png" alt="Sands Investment Group" style="height:58px;">
    <div style="font-family:'Roboto Condensed',sans-serif;font-weight:700;font-size:24px;letter-spacing:0.3em;text-transform:uppercase;color:rgba(255,255,255,0.7);">Net Lease &nbsp;|&nbsp; [Product Type]</div>
  </div>
  <div style="display:flex;flex-direction:column;gap:32px;max-width:1520px;">
    <div style="font-family:'Roboto Condensed',sans-serif;font-weight:700;font-size:28px;letter-spacing:0.3em;text-transform:uppercase;color:var(--orange);">Broker Opinion of Value</div>
    <h1 style="margin:0;font-family:'Roboto Condensed',sans-serif;font-weight:700;font-size:100px;line-height:1.02;">[TENANT / OPERATOR]</h1>
    <div style="font-size:38px;font-weight:300;color:rgba(255,255,255,0.88);">[000 Street Name] &nbsp;|&nbsp; [City, ST 00000]</div>
    <div style="font-family:'Roboto Condensed',sans-serif;font-weight:700;font-size:26px;letter-spacing:0.14em;text-transform:uppercase;color:#7fc4e8;">APN [000-000-000] &nbsp;·&nbsp; [0,000] SF &nbsp;·&nbsp; [LEASE STRUCTURE] since [0000]</div>
  </div>
  <div style="display:flex;justify-content:space-between;align-items:flex-end;border-top:1px solid var(--line-dark);padding-top:24px;">
    <div style="display:flex;flex-direction:column;gap:6px;">
      <div style="font-family:'Roboto Condensed',sans-serif;font-weight:700;font-size:24px;letter-spacing:0.14em;text-transform:uppercase;color:rgba(255,255,255,0.6);">Prepared for</div>
      <div style="font-size:32px;font-weight:400;">[OWNERSHIP ENTITY] &nbsp;·&nbsp; [c/o ASSET MANAGER]</div>
    </div>
    <div style="display:flex;flex-direction:column;gap:6px;text-align:right;">
      <div style="font-family:'Roboto Condensed',sans-serif;font-weight:700;font-size:24px;letter-spacing:0.14em;text-transform:uppercase;color:rgba(255,255,255,0.6);">Prepared by</div>
      <div style="font-size:32px;font-weight:400;">Sands Investment Group &nbsp;·&nbsp; [Month Year]</div>
    </div>
  </div>
</section>
</div>
</div>
</body>
</html>
