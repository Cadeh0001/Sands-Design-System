<!-- @startingPoint section="SIG Slides" subtitle="Where You Stand — SIG deck bank" viewport="1920x1080" -->
<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<script src="../image-slot.js"></script>
<style>html,body{margin:0;padding:0;background:#08202f;}</style>
</head>
<body>
<div style="width:1280px;height:720px;overflow:hidden;">
<div style="width:1920px;height:1080px;transform:scale(0.66667);transform-origin:top left;position:relative;">
<section data-label="Where You Stand" data-screen-label="03" data-speaker-notes="The client's numbers, stated back plainly. The implied yield is the quiet headline — no judgment, just arithmetic. Confirm figures with the client and referring broker before anything is built on them." style="height:100%;box-sizing:border-box;display:flex;flex-direction:column;padding:84px 100px 64px;background:linear-gradient(135deg,#0d324f 0%,#1b4568 100%);color:#ffffff;font-family:'Roboto',sans-serif;">
  <div style="display:flex;flex-direction:column;gap:14px;">
    <div style="font-family:'Roboto Condensed',sans-serif;font-weight:700;font-size:24px;letter-spacing:0.3em;text-transform:uppercase;color:var(--orange);">Where You Stand</div>
    <h2 style="margin:0;font-family:'Roboto Condensed',sans-serif;font-weight:700;font-size:56px;line-height:1.05;">What You Hold Today, Free and Clear</h2>
    <p style="margin:0;font-size:27px;font-weight:300;color:var(--mut-dark);">Figures as described to us&nbsp;</p>
  </div>
  <div style="margin-top:64px;display:grid;grid-template-columns:repeat(4,1fr);gap:0;border-top:1px solid var(--line-dark);border-bottom:1px solid var(--line-dark);">
    <div style="display:flex;flex-direction:column;gap:12px;padding:44px 36px 44px 0;border-right:1px solid var(--line-dark);">
      <div style="font-family:'Roboto Condensed',sans-serif;font-weight:700;font-size:24px;letter-spacing:0.14em;text-transform:uppercase;color:var(--mut-dark);">Combined value</div>
      <div style="font-family:'Roboto Condensed',sans-serif;font-weight:700;font-size:76px;line-height:1;"><span style="font-family:'Roboto Condensed',sans-serif;font-weight:700;font-size:52px;color:var(--phd-c);background:var(--phd-bg);border-bottom:2px solid var(--phd-b);padding:0 8px;">[~$0.0M]</span></div>
    </div>
    <div style="display:flex;flex-direction:column;gap:12px;padding:44px 36px;border-right:1px solid var(--line-dark);">
      <div style="font-family:'Roboto Condensed',sans-serif;font-weight:700;font-size:24px;letter-spacing:0.14em;text-transform:uppercase;color:var(--mut-dark);">Debt</div>
      <div style="font-family:'Roboto Condensed',sans-serif;font-weight:700;font-size:76px;line-height:1;"><span style="font-family:'Roboto Condensed',sans-serif;font-weight:700;font-size:52px;color:var(--phd-c);background:var(--phd-bg);border-bottom:2px solid var(--phd-b);padding:0 8px;">[$0]</span></div>
    </div>
    <div style="display:flex;flex-direction:column;gap:12px;padding:44px 36px;border-right:1px solid var(--line-dark);">
      <div style="font-family:'Roboto Condensed',sans-serif;font-weight:700;font-size:24px;letter-spacing:0.14em;text-transform:uppercase;color:var(--mut-dark);">Annual cash flow</div>
      <div style="font-family:'Roboto Condensed',sans-serif;font-weight:700;font-size:76px;line-height:1;"><span style="font-family:'Roboto Condensed',sans-serif;font-weight:700;font-size:52px;color:var(--phd-c);background:var(--phd-bg);border-bottom:2px solid var(--phd-b);padding:0 8px;">[~$000K]</span></div>
    </div>
    <div style="display:flex;flex-direction:column;gap:12px;padding:44px 0 44px 36px;">
      <div style="font-family:'Roboto Condensed',sans-serif;font-weight:700;font-size:24px;letter-spacing:0.14em;text-transform:uppercase;color:var(--mut-dark);">Implied yield</div>
      <div style="font-family:'Roboto Condensed',sans-serif;font-weight:700;font-size:76px;line-height:1;color:var(--orange);"><span style="font-family:'Roboto Condensed',sans-serif;font-weight:700;font-size:52px;color:var(--phd-c);background:var(--phd-bg);border-bottom:2px solid var(--phd-b);padding:0 8px;">[0.00%]</span></div>
    </div>
  </div>
  
  <div style="margin-top:auto;display:flex;justify-content:space-between;align-items:center;padding-top:24px;border-top:1px solid var(--line-dark);">
    <span style="font-size:24px;color:rgba(255,255,255,0.55);">Sands Investment Group | Confidential</span>
    <img src="../assets/sig-icon-white.png" alt="SIG" style="height:42px;">
  </div>
</section>
</div>
</div>
</body>
</html>
