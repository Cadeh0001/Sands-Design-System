<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<script src="../image-slot.js"></script>
<style>html,body{margin:0;padding:0;background:#08202f;}</style>
</head>
<body>
<div style="width:1280px;height:720px;overflow:hidden;">
<div style="width:1920px;height:1080px;transform:scale(0.66667);transform-origin:top left;position:relative;">
<section data-label="Cover" data-screen-label="01" data-speaker-notes="Say the client's name, the property, and the purpose in one sentence. This is a valuation and a plan, not a pitch." style="height:100%;box-sizing:border-box;display:flex;flex-direction:column;justify-content:space-between;padding:84px 100px 70px;background:linear-gradient(135deg,#0d324f 0%,#2b5c81 100%);color:#ffffff;font-family:'Roboto',sans-serif;">
  <div style="display:flex;justify-content:space-between;align-items:flex-start;">
    <img src="../assets/sig-wide-white.png" alt="Sands Investment Group" style="height:58px;">
    <div style="font-family:'Roboto Condensed',sans-serif;font-weight:700;font-size:24px;letter-spacing:0.28em;text-transform:uppercase;color:rgba(255,255,255,0.7);">Automotive Net Lease</div>
  </div>
  <div style="display:flex;flex-direction:column;gap:34px;max-width:1520px;">
    <div style="font-family:'Roboto Condensed',sans-serif;font-weight:700;font-size:28px;letter-spacing:0.3em;text-transform:uppercase;color:var(--orange);">DISPOSITION SERVICES</div>
    <h1 style="margin:0;font-family:'Roboto Condensed',sans-serif;font-weight:700;font-size:100px;line-height:1.02;"><span style="font-family:'Roboto Condensed',sans-serif;font-weight:700;font-size:84px;color:var(--phd-c);background:var(--phd-bg);border-bottom:3px solid var(--phd-b);padding:0 16px;">[TENANT / DEALERSHIP NAME]</span></h1>
    <div style="font-size:38px;font-weight:300;color:rgba(255,255,255,0.85);"><span style="font-family:'Roboto Condensed',sans-serif;font-weight:700;font-size:32px;color:var(--phd-c);background:var(--phd-bg);border-bottom:2px solid var(--phd-b);padding:0 10px;">[STREET ADDRESS]</span> &nbsp;|&nbsp; <span style="font-family:'Roboto Condensed',sans-serif;font-weight:700;font-size:32px;color:var(--phd-c);background:var(--phd-bg);border-bottom:2px solid var(--phd-b);padding:0 10px;">[CITY, STATE]</span></div>
  </div>
  <div style="display:flex;justify-content:space-between;align-items:flex-end;border-top:1px solid var(--line-dark);padding-top:32px;">
    <div style="display:flex;flex-direction:column;gap:8px;">
      <div style="font-family:'Roboto Condensed',sans-serif;font-weight:700;font-size:24px;letter-spacing:0.2em;text-transform:uppercase;color:rgba(255,255,255,0.6);">Prepared for</div>
      <div style="font-size:32px;font-weight:400;"><span style="font-family:'Roboto Condensed',sans-serif;font-weight:700;font-size:28px;color:var(--phd-c);background:var(--phd-bg);border-bottom:2px solid var(--phd-b);padding:0 10px;">[OWNER / ENTITY NAME]</span></div>
    </div>
    <div style="display:flex;flex-direction:column;gap:8px;text-align:right;">
      <div style="font-family:'Roboto Condensed',sans-serif;font-weight:700;font-size:24px;letter-spacing:0.2em;text-transform:uppercase;color:rgba(255,255,255,0.6);">Prepared by</div>
      <div style="font-size:32px;font-weight:400;">Cade Huggins &nbsp;|&nbsp; Sands Investment Group</div>
    </div>
  </div>
</section>
</div>
</div>
</body>
</html>
